<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Controle</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="assets/css/style.css">

</head>
<body class="min-h-screen text-white relative overflow-x-hidden">

    <div class="absolute top-0 right-0 w-96 h-96 bg-indigo-600/10 blur-[100px] pointer-events-none -z-10"></div>

    <header class="p-6 flex justify-between items-center max-w-lg mx-auto w-full">
        <h1 class="font-extrabold text-xl tracking-tight">Painel Admin</h1>
        <button id="btn-logout" class="bg-white/5 border border-white/10 px-4 py-2 rounded-xl text-sm font-semibold hover:bg-white/10 transition">Sair</button>
    </header>

    <nav class="flex overflow-x-auto p-4 gap-3 max-w-lg mx-auto w-full border-b border-white/10 mb-4 whitespace-nowrap">
        <button class="tab-btn active bg-[#D4FF00] text-black px-5 py-2 rounded-full text-sm font-bold shadow-[0_0_15px_rgba(212,255,0,0.3)]" data-target="aba-alunos">👥 Alunos</button>
        <button class="tab-btn bg-white/5 border border-white/10 px-5 py-2 rounded-full text-sm font-bold text-zinc-400 hover:text-white" data-target="aba-avisos">📢 Avisos</button>
        <button class="tab-btn bg-white/5 border border-white/10 px-5 py-2 rounded-full text-sm font-bold text-zinc-400 hover:text-white" data-target="aba-eventos">📅 Eventos</button>
        <button class="tab-btn bg-white/5 border border-white/10 px-5 py-2 rounded-full text-sm font-bold text-zinc-400 hover:text-white" data-target="aba-materiais">📚 Materiais</button>
    </nav>

    <main class="p-5 max-w-lg mx-auto w-full pb-20">
        
        <!-- ABA ALUNOS (AGORA COM LISTA DE GERENCIAMENTO) -->
        <section id="aba-alunos" class="tab-content block">
            
            <!-- Bloco 1: Formulário -->
            <div class="bg-white/[0.03] backdrop-blur-xl p-6 rounded-[2rem] border border-white/10 mb-6">
                <h2 class="text-xl font-extrabold mb-4">Novo Aluno</h2>
                <form id="form-aluno" class="space-y-4">
                    <input type="text" id="nome-aluno" placeholder="Nome Completo" class="w-full px-4 py-3 bg-white/[0.05] border border-white/10 rounded-2xl outline-none" required>
                    <input type="number" id="matricula-aluno" placeholder="Matrícula (Apenas Números)" class="w-full px-4 py-3 bg-white/[0.05] border border-white/10 rounded-2xl outline-none" required>
                    <button type="submit" class="w-full bg-[#D4FF00] text-black font-extrabold py-3.5 rounded-full shadow-[0_0_15px_rgba(212,255,0,0.2)]">Cadastrar Aluno</button>
                </form>
            </div>

            <!-- Bloco 2: Lista de Alunos -->
            <div class="bg-white/[0.03] backdrop-blur-xl p-6 rounded-[2rem] border border-white/10">
                <h2 class="text-xl font-extrabold mb-4">Alunos Cadastrados</h2>
                
                <!-- A lista gerada pelo JS vai aparecer aqui dentro. 
                     Adicionamos max-h-72 e overflow-y-auto para a lista rolar caso tenha muitos alunos. -->
                <div id="lista-alunos" class="space-y-3 max-h-72 overflow-y-auto">
                    <p class="text-zinc-500 text-sm text-center">Carregando lista...</p>
                </div>
            </div>
            
        </section>

        <!-- ABA AVISOS -->
        <section id="aba-avisos" class="tab-content hidden">
            <div class="bg-white/[0.03] backdrop-blur-xl p-6 rounded-[2rem] border border-white/10">
                <h2 class="text-xl font-extrabold mb-4">Novo Aviso</h2>
                <form id="form-aviso" class="space-y-4">
                    <input type="text" id="titulo-aviso" placeholder="Título" class="w-full px-4 py-3 bg-white/[0.05] border border-white/10 rounded-2xl outline-none" required>
                    <textarea id="texto-aviso" rows="3" placeholder="Mensagem" class="w-full px-4 py-3 bg-white/[0.05] border border-white/10 rounded-2xl outline-none" required></textarea>
                    <select id="urgencia-aviso" class="w-full px-4 py-3 bg-white/[0.05] border border-white/10 rounded-2xl outline-none text-zinc-400">
                        <option value="normal" class="bg-black">Normal</option>
                        <option value="importante" class="bg-black">Importante</option>
                        <option value="urgente" class="bg-black">Urgente</option>
                    </select>
                    <button type="submit" class="w-full bg-indigo-600 text-white font-extrabold py-3.5 rounded-full">Publicar</button>
                </form>
            </div>
        </section>

        <!-- ABA EVENTOS -->
<!-- ABA EVENTOS (Com Importação) -->
        <section id="aba-eventos" class="tab-content hidden">
            <!-- Agendamento Manual -->
            <div class="bg-white/[0.03] backdrop-blur-xl p-6 rounded-[2rem] border border-white/10 mb-6">
                <h2 class="text-xl font-extrabold mb-4">Agendar Evento Manual</h2>
                <form id="form-evento" class="space-y-4">
                    <input type="text" id="titulo-evento" placeholder="Nome do Evento" class="w-full px-4 py-3 bg-white/[0.05] border border-white/10 rounded-2xl outline-none" required>
                    <input type="date" id="data-evento" class="w-full px-4 py-3 bg-white/[0.05] border border-white/10 rounded-2xl outline-none text-zinc-400" required>
                    <select id="tipo-evento" class="w-full px-4 py-3 bg-white/[0.05] border border-white/10 rounded-2xl outline-none text-zinc-400">
                        <option value="prova" class="bg-black">Prova</option>
                        <option value="trabalho" class="bg-black">Trabalho</option>
                        <option value="feriado" class="bg-black">Feriado</option>
                    </select>
                    <button type="submit" class="w-full bg-indigo-600 text-white font-extrabold py-3.5 rounded-full">Agendar Manualmente</button>
                </form>
            </div>

            <!-- Importação em Massa -->
            <div class="bg-white/[0.03] backdrop-blur-xl p-6 rounded-[2rem] border border-white/10 border-dashed">
                <div class="flex items-center gap-3 mb-2">
                    <span class="text-2xl">⚡</span>
                    <h2 class="text-xl font-extrabold">Importação em Massa</h2>
                </div>
                <p class="text-xs text-zinc-400 mb-4 font-medium leading-relaxed">
                    Envie um arquivo CSV da faculdade para importar tudo de uma vez. <br>
                    <strong class="text-indigo-400">Formato exigido:</strong> Titulo, Data(AAAA-MM-DD), Tipo(prova/trabalho/feriado)
                </p>
                <input type="file" id="arquivo-csv" accept=".csv" class="block w-full text-sm text-zinc-400 file:mr-4 file:py-2.5 file:px-5 file:rounded-full file:border-0 file:text-xs file:font-extrabold file:bg-[#D4FF00] file:text-black hover:file:bg-[#bce000] file:transition-all mb-4 cursor-pointer outline-none">
                <button id="btn-importar-csv" class="w-full bg-white/10 hover:bg-white/20 text-white font-extrabold py-3.5 rounded-full transition-all">
                    Processar Arquivo CSV
                </button>
            </div>
        </section>

        <!-- ABA MATERIAIS -->
        <section id="aba-materiais" class="tab-content hidden">
            <div class="bg-white/[0.03] backdrop-blur-xl p-6 rounded-[2rem] border border-white/10">
                <h2 class="text-xl font-extrabold mb-4">Anexar Material</h2>
                <form id="form-material" class="space-y-4">
                    <input type="text" id="materia-material" placeholder="Disciplina" class="w-full px-4 py-3 bg-white/[0.05] border border-white/10 rounded-2xl outline-none" required>
                    <input type="text" id="titulo-material" placeholder="Título" class="w-full px-4 py-3 bg-white/[0.05] border border-white/10 rounded-2xl outline-none" required>
                    <input type="url" id="link-material" placeholder="Link do Drive" class="w-full px-4 py-3 bg-white/[0.05] border border-white/10 rounded-2xl outline-none" required>
                    <button type="submit" class="w-full bg-indigo-600 text-white font-extrabold py-3.5 rounded-full">Publicar</button>
                </form>
            </div>
        </section>
    </main>

    <script type="module" src="assets/js/admin.js"></script>
</body>
</html>
