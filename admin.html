<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Controle</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'brand-mist': '#D7E1EC',
                        'brand-blue': '#0030CF',
                        'brand-white': '#FFFFFF',
                        'brand-charcoal': '#13171B',
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body class="min-h-screen text-brand-white relative overflow-x-hidden">

    <div class="absolute top-0 right-0 w-80 h-80 bg-brand-blue/15 blur-[80px] pointer-events-none -z-10"></div>

    <header class="p-4 sm:p-6 flex justify-between items-center max-w-lg mx-auto w-full">
        <div class="flex items-center gap-2">
            <i class="ph-fill ph-gear text-2xl text-brand-mist/70"></i>
            <h1 class="font-extrabold text-lg tracking-tight">Painel Admin</h1>
        </div>
        <button id="btn-logout" class="bg-brand-white/5 border border-brand-white/10 px-3 py-1.5 rounded-xl text-xs font-semibold hover:bg-brand-white/10 transition flex items-center gap-1 text-brand-mist/70 hover:text-brand-white">
            <i class="ph-bold ph-sign-out"></i> Sair
        </button>
    </header>

    <nav class="flex overflow-x-auto px-4 pb-3 gap-2 max-w-lg mx-auto w-full border-b border-brand-white/10 mb-4 whitespace-nowrap">
        <button class="tab-btn active bg-brand-blue text-brand-white px-4 py-1.5 rounded-full text-xs font-bold shadow-[0_0_10px_rgba(0,48,207,0.3)] transition flex items-center gap-1" data-target="aba-alunos"><i class="ph-fill ph-users text-sm"></i> Alunos</button>
        <button class="tab-btn bg-brand-white/5 border border-brand-white/10 px-4 py-1.5 rounded-full text-xs font-bold text-brand-mist/70 hover:text-brand-white transition flex items-center gap-1" data-target="aba-avisos"><i class="ph-fill ph-megaphone-simple text-sm"></i> Avisos</button>
        <button class="tab-btn bg-brand-white/5 border border-brand-white/10 px-4 py-1.5 rounded-full text-xs font-bold text-brand-mist/70 hover:text-brand-white transition flex items-center gap-1" data-target="aba-eventos"><i class="ph-fill ph-calendar-blank text-sm"></i> Eventos</button>
        <button class="tab-btn bg-brand-white/5 border border-brand-white/10 px-4 py-1.5 rounded-full text-xs font-bold text-brand-mist/70 hover:text-brand-white transition flex items-center gap-1" data-target="aba-materiais"><i class="ph-fill ph-folder-notch text-sm"></i> Materiais</button>
        <button class="tab-btn bg-brand-white/5 border border-brand-white/10 px-4 py-1.5 rounded-full text-xs font-bold text-brand-mist/70 hover:text-brand-white transition flex items-center gap-1" data-target="aba-rotina"><i class="ph-fill ph-clock text-sm"></i> Rotina</button>
    </nav>

    <main class="p-4 max-w-lg mx-auto w-full pb-20">
        
        <!-- ABA ALUNOS -->
        <section id="aba-alunos" class="tab-content block space-y-4">
            <div class="bg-brand-white/[0.03] backdrop-blur-xl p-5 rounded-2xl border border-brand-white/10">
                <h2 class="text-lg font-extrabold mb-3">Gerenciar Aluno</h2>
                <form id="form-aluno" class="space-y-3">
                    <input type="text" id="nome-aluno" placeholder="Nome Completo" class="w-full px-3 py-2.5 text-sm bg-brand-white/[0.05] border border-brand-white/10 rounded-xl outline-none focus:border-brand-blue placeholder-brand-mist/50" required>
                    <input type="number" id="matricula-aluno" placeholder="Matrícula" class="w-full px-3 py-2.5 text-sm bg-brand-white/[0.05] border border-brand-white/10 rounded-xl outline-none focus:border-brand-blue placeholder-brand-mist/50" required>
                    <div class="flex gap-2">
                        <button type="submit" id="btn-submit-aluno" class="flex-1 bg-brand-blue text-brand-white text-sm font-extrabold py-2.5 rounded-full shadow-[0_0_10px_rgba(0,48,207,0.3)] transition">Cadastrar</button>
                        <button type="button" id="btn-cancel-aluno" class="hidden px-4 bg-brand-white/10 hover:bg-brand-white/20 text-brand-white text-sm font-bold rounded-full transition">Cancelar</button>
                    </div>
                </form>
            </div>
            <div class="bg-brand-white/[0.03] backdrop-blur-xl p-5 rounded-2xl border border-brand-white/10">
                <h2 class="text-lg font-extrabold mb-3">Alunos Cadastrados</h2>
                <div id="lista-alunos" class="space-y-2 max-h-60 overflow-y-auto pr-1"></div>
            </div>
        </section>

        <!-- ABA AVISOS -->
        <section id="aba-avisos" class="tab-content hidden space-y-4">
            <div class="bg-brand-white/[0.03] backdrop-blur-xl p-5 rounded-2xl border border-brand-white/10">
                <h2 class="text-lg font-extrabold mb-3">Gerenciar Aviso</h2>
                <form id="form-aviso" class="space-y-3">
                    <input type="text" id="titulo-aviso" placeholder="Título" class="w-full px-3 py-2.5 text-sm bg-brand-white/[0.05] border border-brand-white/10 rounded-xl outline-none focus:border-brand-blue placeholder-brand-mist/50" required>
                    <textarea id="texto-aviso" rows="3" placeholder="Mensagem" class="w-full px-3 py-2.5 text-sm bg-brand-white/[0.05] border border-brand-white/10 rounded-xl outline-none focus:border-brand-blue placeholder-brand-mist/50" required></textarea>
                    <select id="urgencia-aviso" class="w-full px-3 py-2.5 text-sm bg-brand-white/[0.05] border border-brand-white/10 rounded-xl outline-none text-brand-mist/70">
                        <option value="normal" class="bg-brand-charcoal">Normal</option>
                        <option value="importante" class="bg-brand-charcoal">Importante</option>
                        <option value="urgente" class="bg-brand-charcoal">Urgente</option>
                    </select>
                    <div class="flex gap-2">
                        <button type="submit" id="btn-submit-aviso" class="flex-1 bg-brand-blue text-brand-white text-sm font-extrabold py-2.5 rounded-full transition shadow-[0_0_10px_rgba(0,48,207,0.3)]">Publicar</button>
                        <button type="button" id="btn-cancel-aviso" class="hidden px-4 bg-brand-white/10 hover:bg-brand-white/20 text-brand-white text-sm font-bold rounded-full transition">Cancelar</button>
                    </div>
                </form>
            </div>
            <div class="bg-brand-white/[0.03] backdrop-blur-xl p-5 rounded-2xl border border-brand-white/10">
                <h2 class="text-lg font-extrabold mb-3">Avisos Ativos</h2>
                <div id="lista-admin-avisos" class="space-y-2 max-h-60 overflow-y-auto pr-1"></div>
            </div>
        </section>

        <!-- ABA EVENTOS -->
        <section id="aba-eventos" class="tab-content hidden space-y-4">
            <div class="bg-brand-white/[0.03] backdrop-blur-xl p-5 rounded-2xl border border-brand-white/10">
                <h2 class="text-lg font-extrabold mb-3">Gerenciar Evento</h2>
                <form id="form-evento" class="space-y-3">
                    <input type="text" id="titulo-evento" placeholder="Nome do Evento" class="w-full px-3 py-2.5 text-sm bg-brand-white/[0.05] border border-brand-white/10 rounded-xl outline-none focus:border-brand-blue placeholder-brand-mist/50" required>
                    <input type="date" id="data-evento" class="w-full px-3 py-2.5 text-sm bg-brand-white/[0.05] border border-brand-white/10 rounded-xl outline-none text-brand-mist/70 focus:border-brand-blue" required>
                    <select id="tipo-evento" class="w-full px-3 py-2.5 text-sm bg-brand-white/[0.05] border border-brand-white/10 rounded-xl outline-none text-brand-mist/70">
                        <option value="prova" class="bg-brand-charcoal">Prova</option>
                        <option value="trabalho" class="bg-brand-charcoal">Trabalho</option>
                        <option value="feriado" class="bg-brand-charcoal">Feriado</option>
                    </select>
                    <div class="flex gap-2">
                        <button type="submit" id="btn-submit-evento" class="flex-1 bg-brand-blue text-brand-white text-sm font-extrabold py-2.5 rounded-full transition shadow-[0_0_10px_rgba(0,48,207,0.3)]">Agendar</button>
                        <button type="button" id="btn-cancel-evento" class="hidden px-4 bg-brand-white/10 hover:bg-brand-white/20 text-brand-white text-sm font-bold rounded-full transition">Cancelar</button>
                    </div>
                </form>
            </div>
            
            <div class="bg-brand-white/[0.03] backdrop-blur-xl p-5 rounded-2xl border border-brand-white/10">
                <div class="flex justify-between items-center mb-3">
                    <h2 class="text-lg font-extrabold">Eventos Salvos</h2>
                    <!-- Novo botão de Limpar Tudo -->
                    <button id="btn-limpar-eventos" class="bg-red-500/10 text-red-400 hover:bg-red-500/20 px-3 py-1.5 rounded-lg text-[10px] font-bold flex items-center gap-1 transition uppercase tracking-wider">
                        <i class="ph-bold ph-trash text-sm"></i> Apagar Tudo
                    </button>
                </div>
                <div id="lista-admin-eventos" class="space-y-2 max-h-60 overflow-y-auto pr-1"></div>
            </div>

            <div class="bg-brand-white/[0.03] backdrop-blur-xl p-5 rounded-2xl border border-brand-white/10 border-dashed">
                <div class="flex items-center gap-2 mb-1">
                    <i class="ph-fill ph-lightning text-xl text-brand-blue"></i>
                    <h2 class="text-lg font-extrabold">Importação (CSV)</h2>
                </div>
                <input type="file" id="arquivo-csv" accept=".csv" class="block w-full text-xs text-brand-mist/70 file:mr-3 file:py-1.5 file:px-4 file:rounded-full file:border-0 file:text-[10px] file:font-extrabold file:bg-brand-blue file:text-brand-white hover:file:bg-brand-blue/80 file:transition-all mb-3 cursor-pointer outline-none mt-3">
                <button id="btn-importar-csv" class="w-full bg-brand-white/10 hover:bg-brand-white/20 text-brand-white text-sm font-extrabold py-2.5 rounded-full transition-all">Processar CSV</button>
            </div>
        </section>

        <!-- ABA MATERIAIS -->
        <section id="aba-materiais" class="tab-content hidden space-y-4">
            <div class="bg-brand-white/[0.03] backdrop-blur-xl p-5 rounded-2xl border border-brand-white/10">
                <h2 class="text-lg font-extrabold mb-3">Gerenciar Material</h2>
                <form id="form-material" class="space-y-3">
                    <input type="text" id="materia-material" placeholder="Disciplina" class="w-full px-3 py-2.5 text-sm bg-brand-white/[0.05] border border-brand-white/10 rounded-xl outline-none focus:border-brand-blue placeholder-brand-mist/50" required>
                    <input type="text" id="titulo-material" placeholder="Título" class="w-full px-3 py-2.5 text-sm bg-brand-white/[0.05] border border-brand-white/10 rounded-xl outline-none focus:border-brand-blue placeholder-brand-mist/50" required>
                    <input type="url" id="link-material" placeholder="Link do Drive" class="w-full px-3 py-2.5 text-sm bg-brand-white/[0.05] border border-brand-white/10 rounded-xl outline-none focus:border-brand-blue placeholder-brand-mist/50" required>
                    <div class="flex gap-2">
                        <button type="submit" id="btn-submit-material" class="flex-1 bg-brand-blue text-brand-white text-sm font-extrabold py-2.5 rounded-full transition shadow-[0_0_10px_rgba(0,48,207,0.3)]">Publicar</button>
                        <button type="button" id="btn-cancel-material" class="hidden px-4 bg-brand-white/10 hover:bg-brand-white/20 text-brand-white text-sm font-bold rounded-full transition">Cancelar</button>
                    </div>
                </form>
            </div>
            <div class="bg-brand-white/[0.03] backdrop-blur-xl p-5 rounded-2xl border border-brand-white/10">
                <h2 class="text-lg font-extrabold mb-3">Materiais Publicados</h2>
                <div id="lista-admin-materiais" class="space-y-2 max-h-60 overflow-y-auto pr-1"></div>
            </div>
        </section>

        <!-- ABA ROTINA -->
        <section id="aba-rotina" class="tab-content hidden space-y-4">
            <div class="bg-brand-white/[0.03] backdrop-blur-xl p-5 rounded-2xl border border-brand-white/10">
                <h2 class="text-lg font-extrabold mb-3">Gerenciar Aula</h2>
                <form id="form-horario" class="space-y-3 mb-4">
                    <select id="dia-horario" class="w-full px-3 py-2.5 text-sm bg-brand-white/[0.05] border border-brand-white/10 rounded-xl outline-none text-brand-mist/70 focus:border-brand-blue" required>
                        <option value="1-Segunda-feira" class="bg-brand-charcoal">Segunda-feira</option>
                        <option value="2-Terça-feira" class="bg-brand-charcoal">Terça-feira</option>
                        <option value="3-Quarta-feira" class="bg-brand-charcoal">Quarta-feira</option>
                        <option value="4-Quinta-feira" class="bg-brand-charcoal">Quinta-feira</option>
                        <option value="5-Sexta-feira" class="bg-brand-charcoal">Sexta-feira</option>
                        <option value="6-Sábado" class="bg-brand-charcoal">Sábado</option>
                    </select>
                    <input type="text" id="materia-horario" placeholder="Disciplina" class="w-full px-3 py-2.5 text-sm bg-brand-white/[0.05] border border-brand-white/10 rounded-xl outline-none focus:border-brand-blue placeholder-brand-mist/50" required>
                    <input type="text" id="hora-horario" placeholder="Horário" class="w-full px-3 py-2.5 text-sm bg-brand-white/[0.05] border border-brand-white/10 rounded-xl outline-none focus:border-brand-blue placeholder-brand-mist/50" required>
                    <input type="text" id="prof-horario" placeholder="Professor" class="w-full px-3 py-2.5 text-sm bg-brand-white/[0.05] border border-brand-white/10 rounded-xl outline-none focus:border-brand-blue placeholder-brand-mist/50" required>
                    <div class="flex gap-2">
                        <button type="submit" id="btn-submit-horario" class="flex-1 bg-brand-blue text-brand-white text-sm font-extrabold py-2.5 rounded-full shadow-[0_0_10px_rgba(0,48,207,0.3)] transition">Salvar Aula</button>
                        <button type="button" id="btn-cancel-horario" class="hidden px-4 bg-brand-white/10 hover:bg-brand-white/20 text-brand-white text-sm font-bold rounded-full transition">Cancelar</button>
                    </div>
                </form>
                <div class="border-t border-brand-white/10 pt-4">
                    <h3 class="text-[10px] font-extrabold text-brand-mist/70 uppercase tracking-wider mb-2">Grade Cadastrada</h3>
                    <div id="lista-admin-horarios" class="space-y-2 max-h-48 overflow-y-auto pr-1"></div>
                </div>
            </div>

            <div class="bg-brand-white/[0.03] backdrop-blur-xl p-5 rounded-2xl border border-brand-white/10">
                <h2 class="text-lg font-extrabold mb-3">Gerenciar Contato</h2>
                <form id="form-contato" class="space-y-3 mb-4">
                    <input type="text" id="nome-contato" placeholder="Nome" class="w-full px-3 py-2.5 text-sm bg-brand-white/[0.05] border border-brand-white/10 rounded-xl outline-none focus:border-brand-blue placeholder-brand-mist/50" required>
                    <input type="text" id="cargo-contato" placeholder="Cargo" class="w-full px-3 py-2.5 text-sm bg-brand-white/[0.05] border border-brand-white/10 rounded-xl outline-none focus:border-brand-blue placeholder-brand-mist/50" required>
                    <input type="number" id="numero-contato" placeholder="WhatsApp c/ DDD" class="w-full px-3 py-2.5 text-sm bg-brand-white/[0.05] border border-brand-white/10 rounded-xl outline-none focus:border-brand-blue placeholder-brand-mist/50" required>
                    <div class="flex gap-2">
                        <button type="submit" id="btn-submit-contato" class="flex-1 bg-brand-blue text-brand-white text-sm font-extrabold py-2.5 rounded-full shadow-[0_0_10px_rgba(0,48,207,0.3)] transition">Salvar Contato</button>
                        <button type="button" id="btn-cancel-contato" class="hidden px-4 bg-brand-white/10 hover:bg-brand-white/20 text-brand-white text-sm font-bold rounded-full transition">Cancelar</button>
                    </div>
                </form>
                <div class="border-t border-brand-white/10 pt-4">
                    <h3 class="text-[10px] font-extrabold text-brand-mist/70 uppercase tracking-wider mb-2">Contatos Salvos</h3>
                    <div id="lista-admin-contatos" class="space-y-2 max-h-48 overflow-y-auto pr-1"></div>
                </div>
            </div>
        </section>
    </main>

    <script type="module" src="assets/js/admin.js"></script>
</body>
</html>
