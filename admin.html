<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Controle</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body class="min-h-screen text-white relative overflow-x-hidden">

    <div class="absolute top-0 right-0 w-80 h-80 bg-indigo-600/10 blur-[80px] pointer-events-none -z-10"></div>

    <header class="p-4 sm:p-6 flex justify-between items-center max-w-lg mx-auto w-full">
        <div class="flex items-center gap-2">
            <i class="ph-fill ph-gear text-2xl text-zinc-400"></i>
            <h1 class="font-extrabold text-lg tracking-tight">Painel Admin</h1>
        </div>
        <button id="btn-logout" class="bg-white/5 border border-white/10 px-3 py-1.5 rounded-xl text-xs font-semibold hover:bg-white/10 transition flex items-center gap-1 text-zinc-400 hover:text-white">
            <i class="ph-bold ph-sign-out"></i> Sair
        </button>
    </header>

    <nav class="flex overflow-x-auto px-4 pb-3 gap-2 max-w-lg mx-auto w-full border-b border-white/10 mb-4 whitespace-nowrap">
        <button class="tab-btn active bg-[#D4FF00] text-black px-4 py-1.5 rounded-full text-xs font-bold shadow-[0_0_10px_rgba(212,255,0,0.3)] transition flex items-center gap-1" data-target="aba-alunos"><i class="ph-fill ph-users text-sm"></i> Alunos</button>
        <button class="tab-btn bg-white/5 border border-white/10 px-4 py-1.5 rounded-full text-xs font-bold text-zinc-400 hover:text-white transition flex items-center gap-1" data-target="aba-avisos"><i class="ph-fill ph-megaphone-simple text-sm"></i> Avisos</button>
        <button class="tab-btn bg-white/5 border border-white/10 px-4 py-1.5 rounded-full text-xs font-bold text-zinc-400 hover:text-white transition flex items-center gap-1" data-target="aba-eventos"><i class="ph-fill ph-calendar-blank text-sm"></i> Eventos</button>
        <button class="tab-btn bg-white/5 border border-white/10 px-4 py-1.5 rounded-full text-xs font-bold text-zinc-400 hover:text-white transition flex items-center gap-1" data-target="aba-materiais"><i class="ph-fill ph-folder-notch text-sm"></i> Materiais</button>
        <button class="tab-btn bg-white/5 border border-white/10 px-4 py-1.5 rounded-full text-xs font-bold text-zinc-400 hover:text-white transition flex items-center gap-1" data-target="aba-rotina"><i class="ph-fill ph-clock text-sm"></i> Rotina</button>
    </nav>

    <main class="p-4 max-w-lg mx-auto w-full pb-20">
        
        <!-- ABA ALUNOS -->
        <section id="aba-alunos" class="tab-content block space-y-4">
            <div class="bg-white/[0.03] backdrop-blur-xl p-5 rounded-2xl border border-white/10">
                <h2 class="text-lg font-extrabold mb-3">Gerenciar Aluno</h2>
                <form id="form-aluno" class="space-y-3">
                    <input type="text" id="nome-aluno" placeholder="Nome Completo" class="w-full px-3 py-2.5 text-sm bg-white/[0.05] border border-white/10 rounded-xl outline-none focus:border-[#D4FF00]" required>
                    <input type="number" id="matricula-aluno" placeholder="Matrícula (Apenas Números)" class="w-full px-3 py-2.5 text-sm bg-white/[0.05] border border-white/10 rounded-xl outline-none focus:border-[#D4FF00]" required>
                    <div class="flex gap-2">
                        <button type="submit" id="btn-submit-aluno" class="flex-1 bg-[#D4FF00] text-black text-sm font-extrabold py-2.5 rounded-full shadow-[0_0_10px_rgba(212,255,0,0.2)] transition">Cadastrar</button>
                        <button type="button" id="btn-cancel-aluno" class="hidden px-4 bg-white/10 hover:bg-white/20 text-white text-sm font-bold rounded-full transition">Cancelar</button>
                    </div>
                </form>
            </div>
            <div class="bg-white/[0.03] backdrop-blur-xl p-5 rounded-2xl border border-white/10">
                <h2 class="text-lg font-extrabold mb-3">Alunos Cadastrados</h2>
                <div id="lista-alunos" class="space-y-2 max-h-60 overflow-y-auto pr-1"></div>
            </div>
        </section>

        <!-- ABA AVISOS -->
        <section id="aba-avisos" class="tab-content hidden space-y-4">
            <div class="bg-white/[0.03] backdrop-blur-xl p-5 rounded-2xl border border-white/10">
                <h2 class="text-lg font-extrabold mb-3">Gerenciar Aviso</h2>
                <form id="form-aviso" class="space-y-3">
                    <input type="text" id="titulo-aviso" placeholder="Título" class="w-full px-3 py-2.5 text-sm bg-white/[0.05] border border-white/10 rounded-xl outline-none focus:border-indigo-500" required>
                    <textarea id="texto-aviso" rows="3" placeholder="Mensagem" class="w-full px-3 py-2.5 text-sm bg-white/[0.05] border border-white/10 rounded-xl outline-none focus:border-indigo-500" required></textarea>
                    <select id="urgencia-aviso" class="w-full px-3 py-2.5 text-sm bg-white/[0.05] border border-white/10 rounded-xl outline-none text-zinc-400">
                        <option value="normal" class="bg-black">Normal</option>
                        <option value="importante" class="bg-black">Importante</option>
                        <option value="urgente" class="bg-black">Urgente</option>
                    </select>
                    <div class="flex gap-2">
                        <button type="submit" id="btn-submit-aviso" class="flex-1 bg-indigo-600 text-white text-sm font-extrabold py-2.5 rounded-full transition">Publicar</button>
                        <button type="button" id="btn-cancel-aviso" class="hidden px-4 bg-white/10 hover:bg-white/20 text-white text-sm font-bold rounded-full transition">Cancelar</button>
                    </div>
                </form>
            </div>
            <div class="bg-white/[0.03] backdrop-blur-xl p-5 rounded-2xl border border-white/10">
                <h2 class="text-lg font-extrabold mb-3">Avisos Ativos</h2>
                <div id="lista-admin-avisos" class="space-y-2 max-h-60 overflow-y-auto pr-1"></div>
            </div>
        </section>

        <!-- ABA EVENTOS -->
        <section id="aba-eventos" class="tab-content hidden space-y-4">
            <div class="bg-white/[0.03] backdrop-blur-xl p-5 rounded-2xl border border-white/10">
                <h2 class="text-lg font-extrabold mb-3">Gerenciar Evento</h2>
                <form id="form-evento" class="space-y-3">
                    <input type="text" id="titulo-evento" placeholder="Nome do Evento" class="w-full px-3 py-2.5 text-sm bg-white/[0.05] border border-white/10 rounded-xl outline-none focus:border-indigo-500" required>
                    <input type="date" id="data-evento" class="w-full px-3 py-2.5 text-sm bg-white/[0.05] border border-white/10 rounded-xl outline-none text-zinc-400 focus:border-indigo-500" required>
                    <select id="tipo-evento" class="w-full px-3 py-2.5 text-sm bg-white/[0.05] border border-white/10 rounded-xl outline-none text-zinc-400">
                        <option value="prova" class="bg-black">Prova</option>
                        <option value="trabalho" class="bg-black">Trabalho</option>
                        <option value="feriado" class="bg-black">Feriado</option>
                    </select>
                    <div class="flex gap-2">
                        <button type="submit" id="btn-submit-evento" class="flex-1 bg-indigo-600 text-white text-sm font-extrabold py-2.5 rounded-full transition">Agendar</button>
                        <button type="button" id="btn-cancel-evento" class="hidden px-4 bg-white/10 hover:bg-white/20 text-white text-sm font-bold rounded-full transition">Cancelar</button>
                    </div>
                </form>
            </div>
            
            <div class="bg-white/[0.03] backdrop-blur-xl p-5 rounded-2xl border border-white/10">
                <h2 class="text-lg font-extrabold mb-3">Eventos Salvos</h2>
                <div id="lista-admin-eventos" class="space-y-2 max-h-60 overflow-y-auto pr-1"></div>
            </div>

            <div class="bg-white/[0.03] backdrop-blur-xl p-5 rounded-2xl border border-white/10 border-dashed">
                <div class="flex items-center gap-2 mb-1">
                    <i class="ph-fill ph-lightning text-xl text-[#D4FF00]"></i>
                    <h2 class="text-lg font-extrabold">Importação em Massa (CSV)</h2>
                </div>
                <input type="file" id="arquivo-csv" accept=".csv" class="block w-full text-xs text-zinc-400 file:mr-3 file:py-1.5 file:px-4 file:rounded-full file:border-0 file:text-[10px] file:font-extrabold file:bg-[#D4FF00] file:text-black hover:file:bg-[#bce000] file:transition-all mb-3 cursor-pointer outline-none mt-3">
                <button id="btn-importar-csv" class="w-full bg-white/10 hover:bg-white/20 text-white text-sm font-extrabold py-2.5 rounded-full transition-all">Processar CSV</button>
            </div>
        </section>

        <!-- ABA MATERIAIS -->
        <section id="aba-materiais" class="tab-content hidden space-y-4">
            <div class="bg-white/[0.03] backdrop-blur-xl p-5 rounded-2xl border border-white/10">
                <h2 class="text-lg font-extrabold mb-3">Gerenciar Material</h2>
                <form id="form-material" class="space-y-3">
                    <input type="text" id="materia-material" placeholder="Disciplina" class="w-full px-3 py-2.5 text-sm bg-white/[0.05] border border-white/10 rounded-xl outline-none focus:border-indigo-500" required>
                    <input type="text" id="titulo-material" placeholder="Título" class="w-full px-3 py-2.5 text-sm bg-white/[0.05] border border-white/10 rounded-xl outline-none focus:border-indigo-500" required>
                    <input type="url" id="link-material" placeholder="Link do Drive" class="w-full px-3 py-2.5 text-sm bg-white/[0.05] border border-white/10 rounded-xl outline-none focus:border-indigo-500" required>
                    <div class="flex gap-2">
                        <button type="submit" id="btn-submit-material" class="flex-1 bg-indigo-600 text-white text-sm font-extrabold py-2.5 rounded-full transition">Publicar</button>
                        <button type="button" id="btn-cancel-material" class="hidden px-4 bg-white/10 hover:bg-white/20 text-white text-sm font-bold rounded-full transition">Cancelar</button>
                    </div>
                </form>
            </div>
            <div class="bg-white/[0.03] backdrop-blur-xl p-5 rounded-2xl border border-white/10">
                <h2 class="text-lg font-extrabold mb-3">Materiais Publicados</h2>
                <div id="lista-admin-materiais" class="space-y-2 max-h-60 overflow-y-auto pr-1"></div>
            </div>
        </section>

        <!-- ABA ROTINA -->
        <section id="aba-rotina" class="tab-content hidden space-y-4">
            <div class="bg-white/[0.03] backdrop-blur-xl p-5 rounded-2xl border border-white/10">
                <h2 class="text-lg font-extrabold mb-3">Gerenciar Aula</h2>
                <form id="form-horario" class="space-y-3 mb-4">
                    <select id="dia-horario" class="w-full px-3 py-2.5 text-sm bg-white/[0.05] border border-white/10 rounded-xl outline-none text-zinc-400 focus:border-[#D4FF00]" required>
                        <option value="1-Segunda-feira" class="bg-black">Segunda-feira</option>
                        <option value="2-Terça-feira" class="bg-black">Terça-feira</option>
                        <option value="3-Quarta-feira" class="bg-black">Quarta-feira</option>
                        <option value="4-Quinta-feira" class="bg-black">Quinta-feira</option>
                        <option value="5-Sexta-feira" class="bg-black">Sexta-feira</option>
                        <option value="6-Sábado" class="bg-black">Sábado</option>
                    </select>
                    <input type="text" id="materia-horario" placeholder="Disciplina" class="w-full px-3 py-2.5 text-sm bg-white/[0.05] border border-white/10 rounded-xl outline-none focus:border-[#D4FF00]" required>
                    <input type="text" id="hora-horario" placeholder="Horário (Ex: 19:00 - 20:40)" class="w-full px-3 py-2.5 text-sm bg-white/[0.05] border border-white/10 rounded-xl outline-none focus:border-[#D4FF00]" required>
                    <input type="text" id="prof-horario" placeholder="Professor" class="w-full px-3 py-2.5 text-sm bg-white/[0.05] border border-white/10 rounded-xl outline-none focus:border-[#D4FF00]" required>
                    <div class="flex gap-2">
                        <button type="submit" id="btn-submit-horario" class="flex-1 bg-[#D4FF00] text-black text-sm font-extrabold py-2.5 rounded-full shadow-[0_0_10px_rgba(212,255,0,0.2)] transition">Salvar Aula</button>
                        <button type="button" id="btn-cancel-horario" class="hidden px-4 bg-white/10 hover:bg-white/20 text-white text-sm font-bold rounded-full transition">Cancelar</button>
                    </div>
                </form>
                <div class="border-t border-white/10 pt-4">
                    <h3 class="text-[10px] font-extrabold text-zinc-400 uppercase tracking-wider mb-2">Grade Cadastrada</h3>
                    <div id="lista-admin-horarios" class="space-y-2 max-h-48 overflow-y-auto pr-1"></div>
                </div>
            </div>

            <div class="bg-white/[0.03] backdrop-blur-xl p-5 rounded-2xl border border-white/10">
                <h2 class="text-lg font-extrabold mb-3">Gerenciar Contato</h2>
                <form id="form-contato" class="space-y-3 mb-4">
                    <input type="text" id="nome-contato" placeholder="Nome" class="w-full px-3 py-2.5 text-sm bg-white/[0.05] border border-white/10 rounded-xl outline-none focus:border-indigo-500" required>
                    <input type="text" id="cargo-contato" placeholder="Cargo" class="w-full px-3 py-2.5 text-sm bg-white/[0.05] border border-white/10 rounded-xl outline-none focus:border-indigo-500" required>
                    <input type="number" id="numero-contato" placeholder="WhatsApp c/ DDD" class="w-full px-3 py-2.5 text-sm bg-white/[0.05] border border-white/10 rounded-xl outline-none focus:border-indigo-500" required>
                    <div class="flex gap-2">
                        <button type="submit" id="btn-submit-contato" class="flex-1 bg-indigo-600 text-white text-sm font-extrabold py-2.5 rounded-full transition">Salvar Contato</button>
                        <button type="button" id="btn-cancel-contato" class="hidden px-4 bg-white/10 hover:bg-white/20 text-white text-sm font-bold rounded-full transition">Cancelar</button>
                    </div>
                </form>
                <div class="border-t border-white/10 pt-4">
                    <h3 class="text-[10px] font-extrabold text-zinc-400 uppercase tracking-wider mb-2">Contatos Salvos</h3>
                    <div id="lista-admin-contatos" class="space-y-2 max-h-48 overflow-y-auto pr-1"></div>
                </div>
            </div>
        </section>
    </main>

    <script type="module" src="assets/js/admin.js"></script>
</body>
</html>
