<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <!-- A MÁGICA ESTÁ AQUI: maximum-scale=1.0 e user-scalable=no impedem o "zoom" automático do celular -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Portal de Psicologia - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'brand-mist': '#D7E1EC',
                        'brand-blue': '#0030CF',
                        'brand-white': '#FFFFFF',
                        'brand-charcoal': '#13171B',
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<!-- O body agora usa 'fixed inset-0' para travar a tela nas bordas do aparelho, impedindo que fique "solta" -->
<body class="fixed inset-0 w-full h-full flex items-center justify-center p-4 sm:p-6 bg-brand-charcoal overflow-hidden">

    <!-- Luzes de Fundo -->
    <div class="absolute top-[-10%] left-[-10%] w-[250px] h-[250px] bg-brand-blue/30 rounded-full blur-[80px] pointer-events-none"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-[250px] h-[250px] bg-brand-mist/10 rounded-full blur-[80px] pointer-events-none"></div>

    <!-- O card agora tem max-w-sm no celular para ficar mais compacto e max-w-md no tablet/PC -->
    <div class="bg-brand-white/[0.03] backdrop-blur-2xl border border-brand-white/10 p-6 sm:p-8 rounded-3xl shadow-2xl w-full max-w-sm sm:max-w-md relative z-10 mx-auto">
        
        <div class="text-center mb-8">
            <div class="bg-brand-blue text-brand-white w-14 h-14 rounded-2xl flex items-center justify-center mx-auto mb-4 text-3xl shadow-[0_0_20px_rgba(0,48,207,0.4)]">
                <i class="ph-fill ph-brain"></i>
            </div>
            <h1 id="page-title" class="text-2xl sm:text-3xl font-extrabold text-brand-white tracking-tight">Portal Psi</h1>
            <p id="page-subtitle" class="text-brand-mist/70 text-xs sm:text-sm mt-1 font-medium">Digite sua matrícula para entrar</p>
        </div>

        <form id="student-form" class="space-y-4">
            <div>
                <input type="number" id="matricula" name="matricula" autocomplete="username" placeholder="Sua Matrícula" 
                    class="w-full px-4 py-3 bg-brand-white/[0.05] border border-brand-white/10 rounded-xl focus:outline-none focus:bg-brand-white/[0.08] focus:border-brand-blue transition-all font-medium text-brand-white placeholder-brand-mist/50 text-center tracking-widest text-base sm:text-lg" required>
            </div>
            <button type="submit" class="w-full bg-brand-blue hover:bg-brand-blue/80 text-brand-white font-extrabold py-3 px-4 rounded-full transition-all shadow-[0_0_15px_rgba(0,48,207,0.3)] text-sm sm:text-base">
                Acessar Plataforma
            </button>
        </form>

        <form id="admin-form" class="space-y-4 hidden">
            <div>
                <!-- Alterado para text-base para evitar zoom forçado do iOS -->
                <input type="email" id="email" placeholder="E-mail Admin" 
                    class="w-full px-4 py-3 bg-brand-white/[0.05] border border-brand-white/10 rounded-xl focus:outline-none focus:bg-brand-white/[0.08] focus:border-brand-blue transition-all font-medium text-brand-white placeholder-brand-mist/50 text-base">
            </div>
            <div>
                <!-- Alterado para text-base para evitar zoom forçado do iOS -->
                <input type="password" id="password" placeholder="Senha" 
                    class="w-full px-4 py-3 bg-brand-white/[0.05] border border-brand-white/10 rounded-xl focus:outline-none focus:bg-brand-white/[0.08] focus:border-brand-blue transition-all font-medium text-brand-white placeholder-brand-mist/50 text-base">
            </div>
            <button type="submit" class="w-full bg-brand-blue hover:bg-brand-blue/80 text-brand-white font-extrabold py-3 px-4 rounded-full transition-all text-sm sm:text-base shadow-[0_0_15px_rgba(0,48,207,0.3)]">
                Entrar no Painel
            </button>
        </form>

        <div class="mt-6 text-center">
            <button id="toggle-login" type="button" class="text-xs font-semibold text-brand-mist/50 hover:text-brand-white transition-colors">
                🔒 Acesso Restrito (Administrador)
            </button>
        </div>
    </div>

    <script type="module" src="assets/js/auth.js"></script>
</body>
</html>
