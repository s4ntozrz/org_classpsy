<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App do Aluno</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="min-h-screen flex flex-col pb-28 relative overflow-x-hidden text-white">

    <div class="absolute top-0 left-0 w-full h-64 bg-indigo-600/10 blur-[100px] pointer-events-none -z-10"></div>

    <header class="pt-10 pb-4 px-6 flex justify-between items-center max-w-lg mx-auto w-full">
        <div class="flex items-center gap-3">
            <div class="w-12 h-12 bg-white/10 rounded-full flex items-center justify-center text-xl backdrop-blur-md border border-white/10">🎓</div>
            <div>
                <p class="text-zinc-400 text-xs font-medium">Minha Turma</p>
                <h1 class="font-extrabold text-xl tracking-tight">Estudante</h1>
            </div>
        </div>
        <button id="btn-sair" class="w-10 h-10 bg-white/5 hover:bg-white/10 border border-white/10 rounded-full flex items-center justify-center backdrop-blur-md transition-all">
            <span class="text-xs">🚪</span>
        </button>
    </header>

    <main class="p-5 flex-1 max-w-lg mx-auto w-full">

        <section id="tela-avisos" class="tela-app block space-y-6">
            <h2 class="text-2xl font-extrabold tracking-tight">Quadro de Avisos</h2>
            <div id="container-avisos" class="space-y-4"></div>
        </section>

        <!-- EVENTOS -->
        <section id="tela-eventos" class="tela-app hidden space-y-4">
            <h2 class="text-2xl font-extrabold tracking-tight">Calendário</h2>
            
            <!-- Controle de Mês -->
            <div class="bg-indigo-600 rounded-[2rem] p-5 shadow-[0_10px_30px_rgba(79,70,229,0.3)] flex justify-between items-center mb-2">
                <button id="btn-mes-anterior" class="w-10 h-10 bg-black/20 hover:bg-black/40 rounded-full text-white font-bold transition">&lt;</button>
                <h3 id="mes-atual-display" class="font-bold text-white text-lg tracking-wider">...</h3>
                <button id="btn-mes-proximo" class="w-10 h-10 bg-black/20 hover:bg-black/40 rounded-full text-white font-bold transition">&gt;</button>
            </div>

            <!-- Grid do Calendário Visual (Novo) -->
            <div class="bg-white/[0.03] backdrop-blur-2xl p-5 rounded-[2rem] border border-white/10">
                <!-- Cabeçalho dos dias da semana -->
                <div class="grid grid-cols-7 gap-1 text-center text-[10px] font-extrabold text-zinc-500 uppercase tracking-widest mb-2">
                    <div>D</div><div>S</div><div>T</div><div>Q</div><div>Q</div><div>S</div><div>S</div>
                </div>
                <!-- Onde os números dos dias vão aparecer -->
                <div id="calendario-dias" class="grid grid-cols-7 gap-1 text-center"></div>
            </div>

            <!-- Lista de Eventos -->
            <div class="pt-2">
                <h4 id="titulo-lista-eventos" class="text-xs font-extrabold text-zinc-400 uppercase tracking-wider mb-4 pl-1 border-l-2 border-[#D4FF00]">Resumo do Mês</h4>
                <div id="lista-eventos-mes" class="space-y-3"></div>
            </div>
        </section>

        <section id="tela-materiais" class="tela-app hidden space-y-6">
            <h2 class="text-2xl font-extrabold tracking-tight">Materiais</h2>
            <div id="lista-materiais" class="grid grid-cols-2 gap-4"></div>
        </section>

        <section id="tela-notas" class="tela-app hidden space-y-6">
            <h2 class="text-2xl font-extrabold tracking-tight">Minhas Notas</h2>
            <div class="bg-white/[0.03] backdrop-blur-2xl p-5 rounded-[2rem] border border-white/10">
                <form id="form-calc" class="space-y-4">
                    <input type="text" id="calc-materia" placeholder="Disciplina" required class="w-full px-4 py-3 border border-white/10 rounded-2xl bg-white/[0.05] focus:bg-white/[0.08] focus:border-[#D4FF00] outline-none font-medium text-white placeholder-zinc-500">
                    <div class="flex gap-3">
                        <input type="number" id="calc-nota1" placeholder="N1" step="0.1" required class="w-full px-4 py-3 border border-white/10 rounded-2xl bg-white/[0.05] focus:bg-white/[0.08] focus:border-[#D4FF00] outline-none text-white text-center">
                        <input type="number" id="calc-nota2" placeholder="N2" step="0.1" required class="w-full px-4 py-3 border border-white/10 rounded-2xl bg-white/[0.05] focus:bg-white/[0.08] focus:border-[#D4FF00] outline-none text-white text-center">
                    </div>
                    <button type="submit" class="w-full bg-[#D4FF00] text-black font-extrabold py-3.5 rounded-full shadow-[0_0_15px_rgba(212,255,0,0.2)]">Salvar</button>
                </form>
            </div>
            <div id="lista-materias" class="space-y-3"></div>
        </section>

    </main>

    <!-- Nav Inferior (Floating Pill) -->
    <div class="fixed bottom-6 left-0 right-0 flex justify-center z-50 pointer-events-none">
        <nav class="bg-[#1A1A1A]/90 backdrop-blur-2xl border border-white/10 rounded-full flex justify-between items-center px-2 py-2 gap-2 shadow-[0_20px_40px_rgba(0,0,0,0.5)] pointer-events-auto">
            <button class="nav-btn active w-12 h-12 flex items-center justify-center bg-[#D4FF00] text-black rounded-full shadow-[0_0_15px_rgba(212,255,0,0.4)] transition-all duration-300 transform scale-105" data-target="tela-avisos">
                <span class="text-xl">📢</span>
            </button>
            <button class="nav-btn w-12 h-12 flex items-center justify-center text-zinc-500 hover:text-white transition-all duration-300" data-target="tela-eventos">
                <span class="text-xl">📅</span>
            </button>
            <button class="nav-btn w-12 h-12 flex items-center justify-center text-zinc-500 hover:text-white transition-all duration-300" data-target="tela-materiais">
                <span class="text-xl">📚</span>
            </button>
            <button class="nav-btn w-12 h-12 flex items-center justify-center text-zinc-500 hover:text-white transition-all duration-300" data-target="tela-notas">
                <span class="text-xl">📝</span>
            </button>
        </nav>
    </div>

    <script type="module" src="assets/js/app.js"></script>
    <script src="assets/js/calc.js"></script>
</body>
</html>
