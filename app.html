<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App do Aluno</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body class="min-h-screen flex flex-col pb-24 relative overflow-x-hidden text-white">

    <div class="absolute top-0 left-0 w-full h-48 bg-indigo-600/10 blur-[80px] pointer-events-none -z-10"></div>

    <header class="pt-6 pb-2 px-4 flex justify-between items-center max-w-lg mx-auto w-full">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-white/10 rounded-full flex items-center justify-center text-xl backdrop-blur-md border border-white/10 shadow-inner">
                <i class="ph-fill ph-graduation-cap text-[#D4FF00]"></i>
            </div>
            <div>
                <p class="text-zinc-400 text-[10px] font-medium">Minha Turma</p>
                <!-- Colocamos o id="nome-aluno-display" aqui -->
                <h1 id="nome-aluno-display" class="font-extrabold text-lg tracking-tight">Carregando...</h1>
            </div>
        </div>
        <button id="btn-sair" class="w-9 h-9 bg-white/5 hover:bg-white/10 border border-white/10 rounded-full flex items-center justify-center backdrop-blur-md transition-all text-zinc-400 hover:text-white">
            <i class="ph-bold ph-sign-out text-base"></i>
        </button>
    </header>

    <main class="p-4 flex-1 max-w-lg mx-auto w-full">

        <section id="tela-avisos" class="tela-app block space-y-4">
            <h2 class="text-xl font-extrabold tracking-tight">Quadro de Avisos</h2>
            <div id="container-avisos" class="space-y-3"></div>
        </section>

        <section id="tela-eventos" class="tela-app hidden space-y-4">
            <h2 class="text-xl font-extrabold tracking-tight">Calendário</h2>
            <div class="bg-indigo-600 rounded-2xl p-4 shadow-[0_5px_20px_rgba(79,70,229,0.2)] flex justify-between items-center mb-1">
                <button id="btn-mes-anterior" class="w-8 h-8 bg-black/20 hover:bg-black/40 rounded-full text-white transition flex items-center justify-center"><i class="ph-bold ph-caret-left"></i></button>
                <h3 id="mes-atual-display" class="font-bold text-white text-base tracking-wider">...</h3>
                <button id="btn-mes-proximo" class="w-8 h-8 bg-black/20 hover:bg-black/40 rounded-full text-white transition flex items-center justify-center"><i class="ph-bold ph-caret-right"></i></button>
            </div>

            <div class="bg-white/[0.03] backdrop-blur-2xl p-4 rounded-2xl border border-white/10">
                <div class="grid grid-cols-7 gap-1 text-center text-[9px] font-extrabold text-zinc-500 uppercase tracking-widest mb-2">
                    <div>D</div><div>S</div><div>T</div><div>Q</div><div>Q</div><div>S</div><div>S</div>
                </div>
                <div id="calendario-dias" class="grid grid-cols-7 gap-1 text-center text-sm"></div>
            </div>

            <div class="pt-2">
                <h4 id="titulo-lista-eventos" class="text-[11px] font-extrabold text-zinc-400 uppercase tracking-wider mb-3 pl-2 border-l-2 border-[#D4FF00]">Resumo do Mês</h4>
                <div id="lista-eventos-mes" class="space-y-2"></div>
            </div>
        </section>

        <section id="tela-materiais" class="tela-app hidden space-y-4">
            <h2 class="text-xl font-extrabold tracking-tight">Materiais</h2>
            <div id="lista-materiais" class="grid grid-cols-2 gap-3"></div>
        </section>

        <section id="tela-rotina" class="tela-app hidden space-y-6">
            <h2 class="text-xl font-extrabold tracking-tight">Rotina & Contatos</h2>
            <div>
                <h3 class="text-[11px] font-extrabold text-zinc-400 uppercase tracking-wider mb-3 pl-2 border-l-2 border-[#D4FF00]">Grade da Semana</h3>
                <div id="lista-horarios" class="space-y-3"></div>
            </div>
            <div>
                <h3 class="text-[11px] font-extrabold text-zinc-400 uppercase tracking-wider mb-3 pl-2 border-l-2 border-indigo-500">Diretório Útil</h3>
                <div id="lista-contatos" class="grid grid-cols-1 gap-2"></div>
            </div>
        </section>

<section id="tela-notas" class="tela-app hidden space-y-4">
            <h2 class="text-xl font-extrabold tracking-tight">Simulador UNIVERSO</h2>
            <div class="bg-white/[0.03] backdrop-blur-2xl p-4 rounded-2xl border border-white/10">
                <form id="form-calc" class="space-y-3">
                    <input type="text" id="calc-materia" placeholder="Disciplina" required class="w-full px-3 py-2.5 border border-white/10 rounded-xl bg-white/[0.05] focus:bg-white/[0.08] focus:border-[#D4FF00] outline-none text-sm font-medium text-white placeholder-zinc-500">
                    
                    <!-- Notas Principais (Obrigatórias) -->
                    <div class="grid grid-cols-3 gap-2">
                        <input type="number" id="calc-v1" placeholder="V1 (Peso 2)" step="0.1" max="10" required class="w-full px-2 py-2.5 border border-white/10 rounded-xl bg-white/[0.05] focus:bg-white/[0.08] focus:border-indigo-500 outline-none text-white text-xs text-center">
                        <input type="number" id="calc-vt" placeholder="VT (Peso 1)" step="0.1" max="10" required class="w-full px-2 py-2.5 border border-white/10 rounded-xl bg-white/[0.05] focus:bg-white/[0.08] focus:border-indigo-500 outline-none text-white text-xs text-center">
                        <input type="number" id="calc-v2" placeholder="V2 (Peso 2)" step="0.1" max="10" required class="w-full px-2 py-2.5 border border-white/10 rounded-xl bg-white/[0.05] focus:bg-white/[0.08] focus:border-indigo-500 outline-none text-white text-xs text-center">
                    </div>

                    <!-- Notas Opcionais (R1 e VS) -->
                    <div class="grid grid-cols-2 gap-2">
                        <input type="number" id="calc-r1" placeholder="R1 (Opcional - Máx 7)" step="0.1" max="7" class="w-full px-3 py-2.5 border border-white/10 rounded-xl bg-white/[0.05] focus:bg-white/[0.08] focus:border-yellow-500 outline-none text-yellow-500 text-xs text-center placeholder-zinc-500">
                        <input type="number" id="calc-vs" placeholder="VS (Opcional)" step="0.1" max="10" class="w-full px-3 py-2.5 border border-white/10 rounded-xl bg-white/[0.05] focus:bg-white/[0.08] focus:border-red-500 outline-none text-red-400 text-xs text-center placeholder-zinc-500">
                    </div>

                    <button type="submit" class="w-full bg-[#D4FF00] text-black font-extrabold py-2.5 rounded-full shadow-[0_0_10px_rgba(212,255,0,0.2)] text-sm">Calcular & Salvar</button>
                </form>
            </div>
            <div id="lista-materias" class="space-y-2 pb-6"></div>
        </section>

    </main>

    <!-- Nav Inferior (Mais compacta) -->
    <div class="fixed bottom-4 left-0 right-0 flex justify-center z-50 pointer-events-none px-4">
        <nav class="bg-[#1A1A1A]/90 backdrop-blur-2xl border border-white/10 rounded-full flex justify-between items-center px-3 py-2 gap-1 sm:gap-2 shadow-[0_15px_30px_rgba(0,0,0,0.5)] pointer-events-auto w-full max-w-sm">
            
            <button class="nav-btn active w-10 h-10 flex items-center justify-center bg-[#D4FF00] text-black rounded-full shadow-[0_0_15px_rgba(212,255,0,0.3)] transition-all duration-300 transform scale-105" data-target="tela-avisos">
                <i class="ph-fill ph-megaphone-simple text-xl"></i>
            </button>
            <button class="nav-btn w-10 h-10 flex items-center justify-center text-zinc-500 hover:text-white transition-all duration-300" data-target="tela-eventos">
                <i class="ph-fill ph-calendar-blank text-xl"></i>
            </button>
            <button class="nav-btn w-10 h-10 flex items-center justify-center text-zinc-500 hover:text-white transition-all duration-300" data-target="tela-materiais">
                <i class="ph-fill ph-folder-notch text-xl"></i>
            </button>
            <button class="nav-btn w-10 h-10 flex items-center justify-center text-zinc-500 hover:text-white transition-all duration-300" data-target="tela-rotina">
                <i class="ph-fill ph-clock text-xl"></i>
            </button>
            <button class="nav-btn w-10 h-10 flex items-center justify-center text-zinc-500 hover:text-white transition-all duration-300" data-target="tela-notas">
                <i class="ph-fill ph-calculator text-xl"></i>
            </button>
            
        </nav>
    </div>

    <script type="module" src="assets/js/app.js"></script>
    <script src="assets/js/calc.js"></script>
</body>
</html>
